# Render Blueprint for the hosted demo. Render reads this file when you create a
# Blueprint from this repo (Render dashboard > New > Blueprint).
#
# Two services, both on Render's free plan:
#   pa-study-hub-api  the Spring Boot backend, built from the Dockerfile
#   pa-study-hub      the React app as a static site
#
# The database is not on Render: Render's free PostgreSQL is deleted after 30 days.
# It is a free Neon database instead. Render asks for the three values marked
# "sync: false" when the Blueprint is created. They come from Neon's connection
# details:
#   SPRING_DATASOURCE_URL  jdbc:postgresql://<host>/<database>?sslmode=require
#                          (use the direct host, not the "-pooler" one, so the
#                          Flyway migrations can run)
#   DB_USER, DB_PASSWORD   the Neon role and its password
#
# The free backend sleeps after 15 minutes without visitors. The next visit wakes
# it up, which takes about a minute, and the app says so if a request fails meanwhile.

services:
  - type: web
    name: pa-study-hub-api
    runtime: docker
    plan: free
    # Same area as the Neon database (AWS US West 2, Oregon), so each query stays short.
    # Oregon is also the closest region to the people using the app (Washington state).
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    # Only rebuild the backend when backend files change
    buildFilter:
      paths:
        - app/**
        - build.gradle.kts
        - settings.gradle.kts
        - lombok.config
        - gradle/**
        - Dockerfile
    envVars:
      # Render makes up a random value once and keeps it
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Optional: a Groq API key turns on the AI features. Left empty they stay off.
      # The daily limits (20 per user, 300 for the site) keep a free key from running out.
      - key: AI_API_KEY
        sync: false
      # Emails (password reset, email confirmation) through Brevo. Set both in the
      # dashboard; without the key emails are only logged.
      - key: MAIL_BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      # "Continue with Google". The client ID is public (Google's button puts it in
      # the page), so it can live here. The client secret is never used.
      - key: GOOGLE_CLIENT_ID
        value: 104674216459-82m78lgjf8p3i5ug3ftes3u6kkserktt.apps.googleusercontent.com
      # The free plan has a small share of one CPU. These two options make the
      # JVM start faster with it, which matters because every wake-up is a start.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:+UseSerialGC -XX:TieredStopAtLevel=1

  - type: web
    name: pa-study-hub
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Security headers for every page (same values as frontend/security-headers.json;
    # a unit test checks the copies match). The CSP still allows Google's sign-in script.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: 'default-src ''self''; script-src ''self'' https://accounts.google.com/gsi/client; style-src ''self'' ''unsafe-inline'' https://accounts.google.com/gsi/style https://fonts.googleapis.com; font-src ''self'' https://fonts.gstatic.com; img-src ''self'' data: blob: https://*.googleusercontent.com; connect-src ''self'' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src ''none''; base-uri ''self''; form-action ''self''; frame-ancestors ''none'''
      - path: /*
        name: X-Frame-Options
        value: 'DENY'
      - path: /*
        name: X-Content-Type-Options
        value: 'nosniff'
      - path: /*
        name: Referrer-Policy
        value: 'strict-origin-when-cross-origin'
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: 'same-origin-allow-popups'
      - path: /*
        name: Permissions-Policy
        value: 'camera=(), microphone=(), geolocation=()'
      - path: /*
        name: Strict-Transport-Security
        value: 'max-age=31536000'
    buildFilter:
      paths:
        - frontend/**
    routes:
      # The app calls the API on its own address at /api/v1. Render passes those
      # requests on to the backend, the job Vite does in development and nginx in
      # Docker. If Render gave the backend a different address than the one
      # below (it adds a suffix when the name is taken), change it here.
      - type: rewrite
        source: /api/*
        destination: https://pa-study-hub-api.onrender.com/api/*
      # Every other address gets index.html, and React Router shows the right page
      - type: rewrite
        source: /*
        destination: /index.html
