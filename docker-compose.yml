version: "3.9"

# PA Study Hub — Docker Compose (Monolith)
# Spins up the monolith app, single database, and frontend.
# Prerequisites: Docker Desktop, .env file (copy from .env.example)
#
# Usage:
#   docker-compose up -d          # Start everything in background
#   docker-compose logs -f        # Follow logs
#   docker-compose down -v        # Stop and delete volumes

networks:
  pa-study-network:
    driver: bridge

volumes:
  postgres-data:

services:

  # =============================================
  # DATABASE
  # =============================================

  postgres:
    image: postgres:15-alpine
    container_name: pa-study-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pa_study_hub}
      POSTGRES_USER: ${DB_USERNAME:-pastudyhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pastudyhub_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - pa-study-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pastudyhub} -d ${DB_NAME:-pa_study_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================
  # MONOLITH APPLICATION
  # =============================================

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pa-study-hub-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-pa_study_hub}
      DB_USERNAME: ${DB_USERNAME:-pastudyhub}
      DB_PASSWORD: ${DB_PASSWORD:-pastudyhub_pass}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRY_MS: ${JWT_ACCESS_TOKEN_EXPIRY_MS:-900000}
      JWT_REFRESH_TOKEN_EXPIRY_DAYS: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS:-7}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-4096}
      AI_DAILY_TOKEN_BUDGET_PER_USER: ${AI_DAILY_TOKEN_BUDGET_PER_USER:-50000}
      AI_RATE_LIMIT_REQUESTS_PER_MINUTE: ${AI_RATE_LIMIT_REQUESTS_PER_MINUTE:-10}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pa-study-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # =============================================
  # FRONTEND
  # =============================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pa-study-hub-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
    ports:
      - "3000:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - pa-study-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
