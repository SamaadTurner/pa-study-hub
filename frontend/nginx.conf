server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # The React app calls the API at /api/v1 on its own address. nginx passes
    # those requests on to the backend, the same job the Vite proxy does in
    # development. "app" is the backend's service name in docker-compose.yml.
    # ^~ makes this win over the file-extension rule below.
    location ^~ /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The built files have a hash in their name, so they can be cached for a long time
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Used by the container health check
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
        access_log off;
    }

    # Every other address gets index.html, and React Router shows the right page
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/x-javascript text/xml application/xml
               application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
}
