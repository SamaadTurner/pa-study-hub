spring:
  application:
    name: pa-study-hub

  main:
    allow-bean-definition-overriding: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pa_study_hub}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  error:
    include-message: always
    # It was "on_param", which sent the full Java stack trace to anyone who added
    # ?trace=true to a request. That shows the inside of the app to strangers.
    include-stacktrace: never

# JWT Configuration
# There is no default secret on purpose. A secret that sits in a public repo would
# let anyone sign their own login tokens, so the app refuses to start without
# JWT_SECRET (32 characters or more). The "dev" profile has one for local use.
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-ms: ${JWT_ACCESS_TOKEN_EXPIRY_MS:900000} # 15 minutes
  refresh-token-expiry-days: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS:7}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Logging
logging:
  level:
    root: INFO
    com.pastudyhub: INFO
    org.springframework.web: INFO
    # Every SQL statement in the log is useful while developing (see application-dev.yml)
    # but too much on a server
    org.hibernate.SQL: WARN
