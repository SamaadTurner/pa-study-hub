name: Dependency Submission

# GitHub reads the frontend's package-lock.json by itself, but not Gradle build files. This job
# sends the backend's resolved dependencies to GitHub's dependency graph, so Dependabot alerts
# cover Spring Boot and the other Java libraries too. It changes nothing in the repo, and
# Render's build filters ignore .github/, so it never redeploys the site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-submission:
    name: Submit Gradle dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/dependency-submission@v6
