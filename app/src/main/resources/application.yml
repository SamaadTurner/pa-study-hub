spring:
  application:
    name: pa-study-hub

  main:
    allow-bean-definition-overriding: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pa_study_hub}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  error:
    include-message: always
    # It was "on_param", which sent the full Java stack trace to anyone who added
    # ?trace=true to a request. That shows the inside of the app to strangers.
    include-stacktrace: never

# JWT Configuration
# There is no default secret on purpose. A secret that sits in a public repo would
# let anyone sign their own login tokens, so the app refuses to start without
# JWT_SECRET (32 characters or more). The "dev" profile has one for local use.
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-ms: ${JWT_ACCESS_TOKEN_EXPIRY_MS:900000} # 15 minutes
  refresh-token-expiry-days: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS:7}

# Which scheduler sets the next review date: sm2 or fsrs (see SchedulingProperties).
# Both run on every review, so switching keeps every card's history.
scheduling:
  algorithm: ${SCHEDULING_ALGORITHM:fsrs}
  desired-retention: ${SCHEDULING_DESIRED_RETENTION:0.9}

# Emails (password reset, email confirmation) through Brevo's web API. Without a
# key they are only written to the log. Render's free plan blocks SMTP ports.
mail:
  brevo-api-key: ${MAIL_BREVO_API_KEY:}
  from-address: ${MAIL_FROM_ADDRESS:}
  from-name: PA Study Hub
  app-base-url: ${APP_BASE_URL:https://pa-study-hub.onrender.com}

# "Continue with Google". Off unless GOOGLE_CLIENT_ID is set. The client ID is
# public (Google's button shows it in the page), the client secret is never used.
google:
  client-id: ${GOOGLE_CLIENT_ID:}

# How often the server hands in timed exams whose time ran out (ExamTimeLimitJob)
exam:
  time-limit-check-ms: 60000

# Optional AI features (see com.pastudyhub.ai.AiProperties). Off unless AI_API_KEY
# is set. The defaults use Groq's free tier, which needs no credit card.
ai:
  base-url: ${AI_BASE_URL:https://api.groq.com/openai/v1}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:openai/gpt-oss-120b}
  timeout-seconds: 30
  # Requests per day (UTC), so a free key can't be used up by one user or a script
  daily-limit-per-user: ${AI_DAILY_LIMIT_PER_USER:20}
  daily-limit-total: ${AI_DAILY_LIMIT_TOTAL:300}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Logging
logging:
  level:
    root: INFO
    com.pastudyhub: INFO
    org.springframework.web: INFO
    # Every SQL statement in the log is useful while developing (see application-dev.yml)
    # but too much on a server
    org.hibernate.SQL: WARN
