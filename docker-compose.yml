# Runs the whole app in containers: PostgreSQL, the backend and the frontend.
#
#   cp .env.example .env      (then set JWT_SECRET in .env)
#   docker compose up --build
#
# Then open http://localhost:3000 and register an account.
# CI starts this file on every push and registers a user through it, so it is
# known to work (see the "compose" job in .github/workflows/ci.yml).

services:

  # The database is only reachable from the other containers. To look at it from
  # your machine, add a "ports" entry here (for example "5433:5432").
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pa_study_hub}
      POSTGRES_USER: ${DB_USER:-pastudyhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pastudyhub_pass}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pastudyhub} -d ${DB_NAME:-pa_study_hub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The Spring Boot backend. It creates the tables itself on first start (Flyway).
  # It will not start without JWT_SECRET, on purpose.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      # This setup is plain http on localhost; the refresh cookie must not need HTTPS
      AUTH_COOKIE_SECURE: "false"
      DB_NAME: ${DB_NAME:-pa_study_hub}
      DB_USER: ${DB_USER:-pastudyhub}
      DB_PASSWORD: ${DB_PASSWORD:-pastudyhub_pass}
      JWT_SECRET: ${JWT_SECRET}
      # Optional. Empty leaves the AI features off.
      AI_API_KEY: ${AI_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 and not localhost: inside the container localhost can mean the
      # IPv6 address, which the app does not listen on
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # nginx with the built React app. It also passes /api requests on to the
  # backend (see frontend/nginx.conf), so the browser only talks to port 3000.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres-data:
