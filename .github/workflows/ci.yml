name: CI

on:
  push:
    branches: [main, develop, consolidate-to-monolith, "feat/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Backend — build and test monolith application
  # ============================================================
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build monolith
        run: ./gradlew :app:build -x test --no-daemon
        env:
          JWT_SECRET: test-jwt-secret-for-ci-must-be-at-least-32-chars

      - name: Run backend tests (H2)
        run: ./gradlew :app:test --no-daemon
        env:
          JWT_SECRET: test-jwt-secret-for-ci-must-be-at-least-32-chars

      # Same tests again, this time against the postgres service above, with the
      # schema built by the Flyway migrations. cleanTest makes Gradle run them
      # again instead of reusing the H2 result.
      - name: Run backend tests (PostgreSQL)
        run: ./gradlew :app:cleanTest :app:test --no-daemon
        env:
          JWT_SECRET: test-jwt-secret-for-ci-must-be-at-least-32-chars
          TEST_DATABASE: postgres
          TEST_DB_URL: jdbc:postgresql://localhost:5432/test_db
          TEST_DB_USERNAME: test_user
          TEST_DB_PASSWORD: test_pass

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: "**/build/reports/tests/"
          retention-days: 7

      - name: Upload coverage reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: "**/build/reports/jacoco/"
          retention-days: 7

  # ============================================================
  # Frontend — type-check, unit tests, build
  # ============================================================
  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --reporter=verbose

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: /api/v1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 3

  # ============================================================
  # End-to-end — a real browser clicking through the real app
  # (frontend dev server + backend + PostgreSQL)
  # ============================================================
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: e2e_db
          POSTGRES_USER: e2e_user
          POSTGRES_PASSWORD: e2e_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Playwright starts the backend itself (see frontend/playwright.config.ts).
    # The backend reads these to find the database above.
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: e2e_db
      DB_USER: e2e_user
      DB_PASSWORD: e2e_pass
      JWT_SECRET: test-jwt-secret-for-ci-must-be-at-least-32-chars

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Compile ahead of time. Otherwise the download and compile would count
      # against the time Playwright waits for the backend to start.
      - name: Compile backend
        run: ./gradlew :app:classes --no-daemon

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install the browser for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run e2e

      # The report has a screenshot of every failure and a trace of every retry
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # ============================================================
  # Docker — build monolith and frontend images
  # (Only on pushes to main/develop — skipped on PRs to save time)
  # ============================================================
  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build monolith image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha,scope=monolith
          cache-to: type=gha,mode=max,scope=monolith

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          build-args: VITE_API_URL=/api/v1
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
